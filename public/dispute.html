<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProofPilot dispute</title><link rel="stylesheet" href="/app.css"><script src="/common.js"></script></head>
<body><main>
<div id="cfg"></div>
<p><a href="/disputes">← Dispute queue</a></p>
<div id="head" class="card">Loading dispute from PayPal…</div>
<div id="waiting"></div>
<div class="card ai" id="aiCard"></div>
<div class="card" id="agentCard" style="display:none"></div>
<div class="grid2">
  <div class="card" id="rec"></div>
  <div class="card" id="what"></div>
</div>
<div class="card" id="pack"></div>
<div class="card" id="approve"></div>
<div id="sandboxTools"></div>
<div class="grid2"><div class="card" id="records"></div><div class="card" id="histCard"></div></div>
</main>
<script>
PP.nav('/disputes');
const id = decodeURIComponent(location.pathname.split('/').pop());
let A = null; let type = null; let pollTimer = null; let AI = null; let custom = [];
const refChip = (r) => { const rec = A?.records.find(x => x.type === r.type && x.id === r.id);
  return `<span class="chip" title="${PP.esc(rec?.note || rec?.source || '')}">${PP.esc(r.type)} ${PP.esc(r.id)}</span>${r.type === 'tracker' ? '<span class="testdata">sandbox test data</span>' : ''}`; };
const currentPack = () => type === 'SUPPORTING_INFO' ? A.supporting : A.packs[type];

// Every AI answer carries one of three labels: LIVE (the model answered now), RULES ENGINE FALLBACK, or CACHED DEMO
// (a committed run recorded earlier, shown only on request when the live model is unavailable).
const RUN_BADGE = { LIVE_MODEL: ['LIVE MODEL', 'review'], RULES_FALLBACK: ['RULES ENGINE FALLBACK', 'wait'], CACHED_DEMO: ['CACHED DEMO RUN (not live)', 'closed'] };
const runBadge = (k) => PP.badge(...(RUN_BADGE[k] || RUN_BADGE.RULES_FALLBACK));
let DEMO = null;
function demoButton() { return '<button class="sec" id="showDemo">Show the cached demo run (recorded earlier, not live)</button>'; }
function demoHtml() {
  if (!DEMO) return '';
  const r = DEMO.run;
  return `<div class="banner wait" id="cachedDemo">${runBadge('CACHED_DEMO')} <b>${PP.esc(DEMO.label)}</b><br>
    Recorded ${PP.esc(DEMO.recorded_at_ist)} on sandbox dispute ${PP.esc(DEMO.recorded_on_dispute)} · model reported by the API: ${PP.esc(DEMO.reported_model)} · ${PP.esc(DEMO.toolkit)}.<br><small>${PP.esc(DEMO.why)}</small>
    <div>Recommendation then: <b>${PP.esc(PP.h('rec', r.recommendation?.action))}</b>. Tool calls: ${r.activity.map(a => PP.esc(PP.h('tool', a.tool)) + ' (' + (a.kind === 'read' ? 'read' : 'write, proposed only') + ')').join(', ')}.</div>
    ${r.proposals.map(p => `<div class="claim">${PP.esc(p.description || '')} · <b>cached demo, not approvable</b></div>`).join('')}</div>`;
}
function wireDemo() { if (window.showDemo) showDemo.onclick = async () => { try { DEMO = await PP.api('/api/demo/cached-agent-run'); } catch (e) { DEMO = null; alert(e.message); } renderAi(); }; }
function renderAi() {
  const c = PP.cfg?.ai;
  if (!c?.configured) { aiCard.innerHTML = `<h2>AI advisor ${runBadge('RULES_FALLBACK')}</h2><p class="muted">Not configured on this server: set <code>GEMINI_API_KEY</code> (Google Gemini) or <code>GROQ_API_KEY</code> (Groq) and restart. Until then the rules engine below makes the recommendation. No AI output is simulated; you can look at a recorded agent run, clearly marked as cached.</p>${DEMO ? demoHtml() : demoButton()}`; wireDemo(); return; }
  let body = `<h2>AI advisor <small>${PP.esc(c.label)}${c.agent ? ' · agent on ' + PP.esc(c.agent.toolkit) : ''}</small></h2><p class="muted">The model recommends an action and picks supporting facts by id. It does not write the evidence text: each fact is a sentence ProofPilot renders from fields of the PayPal records below. Any free text the model returns is refused unless it is exactly one of those facts. The checker confirms a fact is in the cited record; it cannot tell whether the fact helps your case. You tick and approve each sentence before anything is sent.</p>`;
  if (!AI) body += `<button id="askAi">Ask ${PP.esc(c.label)}</button>`;
  else if (!AI.ok) body += `<div class="banner err">${runBadge('RULES_FALLBACK')} ${AI.run?.liveError === 'RATE_LIMITED' ? 'The live model is rate-limited (Gemini free tier: 20 requests per model per day).' : 'The model call failed (' + PP.esc(AI.error) + ').'} Using the rules engine recommendation.</div><button class="sec" id="askAi">Try again</button> ${AI.cachedDemo?.available ? (DEMO ? '' : demoButton()) : ''}${demoHtml()}`;
  else {
    const r = AI.recommendation;
    const refusedAll = [...AI.rationale.refused, ...AI.narrative.refused];
    const why = [...new Set(refusedAll.map(x => PP.h('refusal', x.reason)))];
    body += `<div>${runBadge(AI.run?.kind)} <small>${PP.esc(AI.run?.note || '')}</small></div><h2>${PP.esc(PP.h('rec', r.action))}${r.evidenceType ? `: ${PP.esc(PP.h('evidence', r.evidenceType))}` : ''} <small>(${r.source === 'llm' ? 'model' : 'rules fallback'}; ${AI.agreesWithRules ? 'agrees with' : 'differs from'} the rules engine, which says "${PP.esc(PP.h('rec', AI.rules.action))}")</small></h2>
      ${AI.flags.map(f => `<div class="gap">${PP.esc(f)}</div>`).join('')}
      <b>Facts behind the recommendation</b>${AI.rationale.accepted.map(c => `<div class="claim">${PP.esc(c.text)}<div>${c.refs.map(refChip).join('')}</div></div>`).join('') || '<div class="muted">No reason the model gave passed the checker.</div>'}
      <b>Facts the model suggests sending</b> <small>(rendered from PayPal record fields; tick to add to the pack)</small>
      ${AI.narrative.accepted.map(c => `<div class="claim"><input type="checkbox" class="aiPick" value="${PP.esc(c.id)}"> ${PP.esc(c.text)}<div>${c.refs.map(refChip).join('')}</div></div>`).join('') || `<div class="muted">${AI.narrative.refused.length ? 'No suggested sentence passed the checker.' : 'The model suggested no facts to send (nothing to send for this recommendation).'}</div>`}
      ${refusedAll.length ? `<details class="refused"><summary>${refusedAll.length} model sentence(s) refused by the checker (${PP.esc(why.join('; '))}). Show the refused text</summary>
        <p class="muted">This is the model's own wording. It was refused and is never sent to PayPal.</p>
        ${refusedAll.map(x => `<div class="claim bad">${PP.esc(PP.h('refusal', x.reason))}: <s>${PP.esc(x.text || '')}</s></div>`).join('')}</details>` : ''}
      ${AI.offerAmount ? `<div>Suggested offer: ${PP.esc(A.amount.currency_code)} ${PP.esc(AI.offerAmount)}</div>` : ''}
      <small>${PP.esc(AI.provider)} · ${PP.esc(AI.model)} · ${AI.ms ?? '?'} ms · ${new Date(AI.generatedAt).toLocaleTimeString()}${AI.cached ? ' (cached for this dispute version)' : ''}</small>
      <p><button class="sec" id="askAi">Regenerate</button></p>`;
  }
  aiCard.innerHTML = body; wireDemo();
  if (window.askAi) askAi.onclick = async () => { askAi.disabled = true; askAi.textContent = 'Asking the model…';
    try { AI = await PP.api(`/api/disputes/${encodeURIComponent(id)}/ai`, { method: 'POST', body: { refresh: Boolean(AI) } }); } catch (e) { AI = { ok: false, error: e.message }; }
    renderAi(); renderApprove(); loadAgent(); };
  document.querySelectorAll('.aiPick').forEach(x => x.onchange = renderApprove);
}

function render() {
  const s = A.status; const dl = A.deadline;
  head.innerHTML = `<h1>${PP.esc(A.id)} ${PP.badge(s.label, s.tone)}</h1>
    <div><b>${PP.hc('reason', A.reason)}</b> · <b>${PP.esc(A.amount.currency_code)} ${PP.esc(A.amount.value)}</b> at stake${A.partialDispute ? ` (partial dispute: the payment was ${PP.esc(A.paymentAmount.currency_code)} ${PP.esc(A.paymentAmount.value)}; PayPal lists ${PP.esc(A.amount.currency_code)} ${PP.esc(A.amount.value)} as disputed)` : ''} · ${PP.hc('stage', A.stage)}</div>
    <div>${dl ? `Respond by <b>${new Date(dl.due).toLocaleString()}</b> (${dl.overdue ? '<span class="sev-BLOCK">overdue</span>' : `${dl.hoursLeft} h left`})` : '<span class="muted">No seller response deadline set by PayPal right now.</span>'}</div>
    <small title="PayPal code: ${PP.esc(A.paypalStatus)}">${PP.esc(s.detail || '')}</small>`;
  waiting.innerHTML = s.waiting ? `<div class="banner wait">⏳ <b>Waiting for PayPal.</b> ${PP.esc(s.detail)} Last checked ${new Date().toLocaleTimeString()}.</div>` : '';

  const r = A.recommendation;
  rec.innerHTML = `<h2>Rules engine: ${PP.esc(PP.h('rec', r.action))}${r.evidenceType ? `: ${PP.esc(PP.h('evidence', r.evidenceType))}` : ''}</h2>
    <ul>${r.reasons.map(x => `<li>${PP.esc(x)}</li>`).join('')}</ul>
    <small>${PP.esc(r.engine)}: deterministic rules, not AI. Used as the fallback and as a sanity check on the AI advisor.</small>`;

  what.innerHTML = `<h2>What PayPal is asking for</h2>
    ${A.allowedTypes.length ? A.allowedTypes.map(t => `<span class="minichip" title="${PP.esc(t)}">${PP.esc(PP.h('evidence', t))}</span>`).join('') : '<div class="muted">PayPal is not requesting any evidence right now.</div>'}
    <div style="margin-top:8px">You can: ${s.actions.length ? s.actions.map(a => `<span class="minichip" title="${PP.esc(a)}">${PP.esc(PP.h('action', a))}</span>`).join('') : '<span class="muted">nothing yet</span>'}</div>
    <div style="margin-top:8px">Seller Protection: ${A.transaction.protectionEligible ? 'eligible (' + PP.esc(PP.h('protection', A.transaction.protectionType)) + ')' : 'not listed as eligible'}</div>
    ${A.gaps.map(g => `<div class="gap">${PP.esc(g.message)}</div>`).join('')}`;

  const types = [...A.allowedTypes, ...(A.supporting ? ['SUPPORTING_INFO'] : [])];
  if (!types.includes(type)) type = r.evidenceType && types.includes(r.evidenceType) ? r.evidenceType : types[0] || null;
  const p = type ? currentPack() : null;
  pack.innerHTML = `<h2>Evidence pack</h2>` + (!p ? '<div class="muted">No evidence can be sent right now: PayPal is not requesting evidence and offers no supporting-info action.</div>' :
    `<label>Pack type: only evidence PayPal requests on this dispute, plus supporting info when PayPal offers it</label><select id="typeSel">${types.map(t => `<option value="${t}" ${t === type ? 'selected' : ''}>${PP.esc(PP.h('evidence', t))}${(A.paypalRejected || []).some(r => r.type === t) ? ' - refused by PayPal' : ''}</option>`).join('')}</select>
     <div style="margin-top:8px">${p.validation.accepted.map(c => c.untrusted
        ? `<div class="claim untrusted"><input type="checkbox" class="cl" value="${PP.esc(c.id)}"> <span class="testdata">buyer-entered, not ticked</span> <blockquote>${PP.esc(c.text)}</blockquote><small>Typed by the buyer, not checked by ProofPilot. Only tick it if you want PayPal to see the buyer's own wording, quoted.</small><div>${c.refs.map(refChip).join('')}</div></div>`
        : `<div class="claim"><input type="checkbox" class="cl" value="${PP.esc(c.id)}" checked> ${PP.esc(c.text)}<div>${c.refs.map(refChip).join('')}</div></div>`).join('')}
     ${p.validation.rejected.map(x => `<div class="claim bad">A built-in sentence was refused by the checker: ${PP.esc(PP.h('refusal', x.reason))}</div>`).join('')}
     ${p.gaps.map(g => `<div class="gap">Gap: ${PP.esc(g.message)}</div>`).join('')}
     ${(A.refusalRisks || []).filter(x => x.type === type).map(x => `<div class="gap">Warning: ${PP.esc(x.message)}</div>`).join('')}
     ${(A.paypalRejected || []).some(r => r.type === type) ? `<div class="banner err">PayPal already refused ${PP.esc(PP.h('evidence', type))} on this dispute at this stage. ProofPilot will not send it again.</div>` : ''}
     ${type !== 'SUPPORTING_INFO' && !p.requirementMet ? `<div class="banner err">This pack lacks the record ${PP.esc(PP.h('evidence', type))} needs, so it cannot be submitted.</div>` : ''}</div>
     <h2 style="margin-top:12px">Add your own statement</h2><small>Your own wording. The checker confirms you cite a record ProofPilot fetched from PayPal and that any amount, date or id you write is in that record, and it refuses outcome predictions. It cannot confirm the rest of your sentence: that part is your statement and is sent as yours.</small>
     <div style="display:flex;gap:6px;margin-top:6px"><input id="ctext" placeholder="e.g. The buyer was emailed the tracking link" style="flex:1">
     <select id="cref"><option value="">(no record)</option>${A.records.map(x => `<option value="${PP.esc(x.type)}|${PP.esc(x.id)}">${PP.esc(x.type)} ${PP.esc(x.id)}</option>`).join('')}</select>
     <button class="sec" id="addBtn">Check & add</button></div><div id="custom"></div>`);
  if (p) { typeSel.onchange = () => { type = typeSel.value; custom = []; render(); }; addBtn.onclick = addClaim; drawCustom(); document.querySelectorAll('.cl').forEach(x => x.onchange = renderApprove); }
  renderAi(); renderApprove();
  sandboxTools.innerHTML = A.sandboxLinks.includes('require_evidence') ? `<div class="card"><h2>Sandbox test tool</h2>
    <p class="muted">PayPal's sandbox offers <span class="chip">require_evidence</span> on this case. It simulates PayPal asking the seller for evidence, so the evidence flow can be shown on an existing dispute. ProofPilot never calls <span class="chip">adjudicate</span> and never shows an outcome it did not get from PayPal.</p>
    <button class="sec" id="reqEv">Sandbox: simulate PayPal requesting seller evidence</button> <span id="reqOut"></span></div>` : '';
  if (window.reqEv) reqEv.onclick = async () => { try { const r = await PP.api(`/api/sandbox/disputes/${encodeURIComponent(id)}/require-evidence`, { method: 'POST', body: {} });
    reqOut.textContent = `${r.before} → ${r.after}`; setTimeout(refresh, 2000); } catch (e) { reqOut.textContent = e.message; } };
  records.innerHTML = `<h2>Records fetched from PayPal</h2><table class="simple"><tr><th>Type</th><th>ID</th><th>Note</th></tr>${A.records.map(x => `<tr><td>${PP.esc(x.display || x.type)}</td><td><span class="chip">${PP.esc(x.id)}</span></td><td><small>${x.note ? `<span class="testdata">${x.type === 'refund' ? (/not a refund/.test(x.display || '') ? 'not a seller refund' : /pending/i.test(x.display || '') ? 'pending, not proof yet' : 'refund') : /after dispute opened|no registration time/.test(x.note) ? 'added after dispute opened' : 'test data'}</span> ` + PP.esc(x.note) : PP.esc(x.source)}</small></td></tr>`).join('')}</table>`;
  histCard.innerHTML = `<h2>Case history (from PayPal)</h2><table class="simple"><tr><th>When</th><th>Who</th><th>What</th><th>Stage</th></tr>${A.history.map(h => `<tr><td>${new Date(h.date).toLocaleString()}</td><td>${PP.esc(PP.h('source', h.source))}</td><td>${PP.esc(h.action ? PP.h('action', h.action.toLowerCase()) : PP.h('evidence', h.type))}${h.action === 'PROVIDE_EVIDENCE' ? ` (${PP.esc(PP.h('evidence', h.type))})` : ''}</td><td>${PP.esc((PP.h('stage', h.stage) || '').split(' (')[0])}</td></tr>`).join('')}</table>`;
}

function drawCustom() { document.getElementById('custom').innerHTML = custom.map(c => `<div class="claim"><span class="testdata">your wording</span> ${PP.esc(c.text)}<div>${c.refs.map(refChip).join('')}</div></div>`).join(''); }
async function addClaim() {
  const [t, i] = (cref.value || '|').split('|'); const claim = { id: 'custom-' + (custom.length + 1), text: ctext.value, refs: t ? [{ type: t, id: i }] : [], source: 'seller' };
  const v = await PP.api(`/api/disputes/${encodeURIComponent(id)}/check`, { method: 'POST', body: { claims: [claim] } });
  if (v.ok) { custom.push(claim); ctext.value = ''; drawCustom(); renderApprove(); }
  else document.getElementById('custom').insertAdjacentHTML('beforeend', `<div class="claim bad">Refused: "${PP.esc(claim.text)}" (${PP.esc(PP.h('refusal', v.rejected[0].reason))}${v.rejected[0].values ? ': ' + PP.esc(v.rejected[0].values.join(', ')) : ''}).</div>`);
}
function aiPicked() { const ids = [...document.querySelectorAll('.aiPick:checked')].map(x => x.value); return (AI?.narrative?.accepted || []).filter(c => ids.includes(c.id)); }
function selectedClaims() { const p = currentPack(); const keep = [...document.querySelectorAll('.cl:checked')].map(x => x.value);
  const extra = [...aiPicked(), ...custom];
  return { exclude: p.validation.accepted.filter(c => !c.untrusted && !keep.includes(c.id)).map(c => c.id),
    include: p.validation.accepted.filter(c => c.untrusted && keep.includes(c.id)).map(c => c.id), extra, claims: [...p.validation.accepted.filter(c => keep.includes(c.id)), ...extra] }; }
async function sha16(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 16); }

function renderApprove() {
  if (!A) return;
  const acts = A.status.actions; const p = type ? currentPack() : null;
  const evidenceAction = type === 'SUPPORTING_INFO' ? 'provide_supporting_info' : 'provide_evidence';
  const refused = (A.paypalRejected || []).some(r => r.type === type);
  const canEvidence = p && !refused && acts.includes(evidenceAction) && (type === 'SUPPORTING_INFO' || p.requirementMet);
  const n = p ? selectedClaims().claims.length : 0; const nAi = aiPicked().length;
  approve.innerHTML = `<h2>Approve and submit</h2>
    ${canEvidence ? `<p>Send <b>${n}</b> cited statement(s)${nAi ? ` (${nAi} AI-drafted)` : ''} as <b>${PP.esc(PP.h('evidence', type))}</b> (${PP.esc(PP.h('action', evidenceAction))}). A PDF of the pack is attached.</p>` : `<p class="muted">Evidence submission is not available: ${p ? [!acts.includes(evidenceAction) ? `PayPal does not offer ${PP.esc(PP.h('action', evidenceAction))} now` : '', !(p.requirementMet || type === 'SUPPORTING_INFO') ? 'the pack is incomplete' : '', refused ? 'PayPal already refused this type here' : ''].filter(Boolean).join('; ') : 'no pack'}.</p>`}
    ${acts.includes('make_offer') ? `<p>Offer amount (${PP.esc(A.amount.currency_code)}): <input id="offerAmt" size="8" placeholder="amount" value="${PP.esc(PP.defaultOfferAmount(A.amount, AGENT?.proposals, AI?.offerAmount))}"> <small class="muted">at most ${PP.esc(A.amount.value)}</small></p>` : ''}
    ${canEvidence ? '<label><input type="checkbox" id="attachPdf" checked> Attach a PDF copy of the pack</label>' : ''}
    ${(A.paypalRejected || []).map(r => `<div class="gap">PayPal rejected ${PP.esc(PP.h('evidence', r.type))} on this dispute ${r.at ? 'at ' + new Date(r.at).toLocaleString() : '(time not recorded)'} (PayPal said this evidence type is not allowed; PayPal debug id ${PP.esc(r.debugId)}).</div>`).join('')}
    <label>Type APPROVE to confirm you reviewed every statement</label><input id="conf" size="12">
    <p>${canEvidence ? '<button id="subEv">Submit to PayPal</button> ' : ''}${acts.includes('make_offer') ? '<button class="sec" id="subOffer">Make offer</button> ' : ''}${acts.includes('accept_claim') ? '<button class="sec" id="subAccept">Accept claim (refund)</button>' : ''}</p>
    <div id="out"></div>`;
  const go = async (body) => {
    out.innerHTML = 'Submitting to PayPal…';
    try { const r = await PP.api(`/api/disputes/${encodeURIComponent(id)}/submit`, { method: 'POST', body: { ...body, approved: true, confirm: conf.value } });
      sessionStorage.setItem('pp-last-submit', JSON.stringify({ id, at: new Date().toISOString(), before: r.before, after: r.after }));
      out.innerHTML = `<div class="banner info" id="submitResult">${r.dryRun ? 'Dry run, nothing sent. ' : 'Sent to PayPal. '}${r.paypal?.debugId ? `PayPal HTTP ${PP.esc(r.paypal.status ?? '')}, debug id <code>${PP.esc(r.paypal.debugId)}</code>. ` : ''}Status: ${PP.badge(r.before.label, 'act')} → ${PP.badge(r.after.label, 'review')}</div><pre>${PP.esc(JSON.stringify(r.payloadPreview, null, 2))}</pre>`;
      setTimeout(refresh, 4000);
    } catch (e) { out.innerHTML = `<div class="banner err">${PP.esc(e.message)}${e.data?.rejected ? '<pre>' + PP.esc(JSON.stringify(e.data.rejected, null, 2)) + '</pre>' : ''}</div>`; }
  };
  if (window.subEv) subEv.onclick = async () => { const { exclude, include, extra, claims } = selectedClaims();
    const canon = JSON.stringify({ disputeId: A.id, evidenceType: type, claims: claims.map(c => ({ id: c.id, text: c.text, refs: c.refs })) });
    go({ action: evidenceAction, evidenceType: type === 'SUPPORTING_INFO' ? undefined : type, excludeClaimIds: exclude, includeClaimIds: include, customClaims: extra, packHash: await sha16(canon), attachPdf: window.attachPdf ? attachPdf.checked : true }); };
  if (window.subOffer) subOffer.onclick = () => go({ action: 'make_offer', offerAmount: offerAmt.value.trim() });
  if (window.subAccept) subAccept.onclick = () => go({ action: 'accept_claim' });
  const last = JSON.parse(sessionStorage.getItem('pp-last-submit') || 'null');
  if (last && last.id === id && !out.innerHTML) out.innerHTML = `<div class="banner info">Last submission ${new Date(last.at).toLocaleString()}: ${PP.badge(last.before.label, 'act')} → ${PP.badge(last.after.label, 'review')}</div>`;
}

// ---- Agent activity: every PayPal Agent Toolkit call the agent made (reads ran; writes were only proposed).
let AGENT = null; let AGENT_WRITES = [];
async function loadAgent() { try { const r = await PP.api(`/api/disputes/${encodeURIComponent(id)}/agent`); AGENT = r.runs?.[0] || null; AGENT_WRITES = r.writes || []; } catch { AGENT = null; } renderAgent();
  if (window.offerAmt && !offerAmt.value && A) offerAmt.value = PP.defaultOfferAmount(A.amount, AGENT?.proposals, AI?.offerAmount); }
function renderAgent() {
  const info = PP.cfg?.ai?.agent; const run = AGENT;
  if (!info && !run) { agentCard.style.display = 'none'; return; }
  agentCard.style.display = '';
  const kindChip = (k) => k === 'read' ? '<span class="minichip">read · ran</span>' : '<span class="minichip warn">write · proposed only</span>';
  let h = `<h2>Agent activity <small>${PP.esc(info?.toolkit || run?.toolkit || '@paypal/agent-toolkit')} · ${PP.esc(PP.cfg?.ai?.model || run?.model || '')} · sandbox</small></h2>
    <p class="muted">Read tools run on their own; results are redacted (no emails, names or addresses). Write tools never run on their own: the agent can only propose them, and a proposal runs only after you approve it here.</p>`;
  if (!run) { agentCard.innerHTML = h + '<div class="muted">No agent run yet for this dispute. Use the AI advisor above.</div>'; return; }
  h += `<small>Run ${new Date(run.at).toLocaleString()} · ${run.ok ? 'finished' : 'failed: ' + PP.esc(run.error || '')} · recommendation "${PP.esc(PP.h('rec', run.recommendation?.action) || '-')}" (${run.recommendation?.source === 'llm' ? 'model' : 'rules fallback'})${run.reportedModel ? ' · model reported by the API: ' + PP.esc(run.reportedModel) : ''}</small>
    <table class="simple" id="agentLog"><tr><th>When</th><th>Step</th><th>Kind</th><th>Arguments</th><th>Result (redacted)</th></tr>
    ${run.activity.map(a => `<tr><td>${new Date(a.at).toLocaleTimeString()}</td><td title="PayPal Agent Toolkit tool: ${PP.esc(a.tool)}">${PP.esc(PP.h('tool', a.tool))}</td><td>${kindChip(a.kind)}${a.ok ? '' : ' <span class="sev-BLOCK">error</span>'}</td>
      <td>${a.kind === 'read' ? `<code>${PP.esc(JSON.stringify(a.args))}</code>` : `<small>model's arguments not used${a.args?.fields?.length ? ' (it supplied: ' + PP.esc(a.args.fields.join(', ')) + ')' : ''}</small>`}</td><td><details><summary>${PP.esc(String(a.result).slice(0, 70))}${String(a.result).length > 70 ? '…' : ''}</summary><pre>${PP.esc(a.result)}</pre></details></td></tr>`).join('') || '<tr><td colspan="5" class="muted">The agent made no tool calls.</td></tr>'}</table>`;
  if ((AGENT_WRITES || []).some(w => !w.dryRun && !w.failed)) h += `<div class="banner info">ProofPilot already sent a ${PP.esc(AGENT_WRITES.filter(w => !w.dryRun && !w.failed).map(w => w.kind + (w.debugId ? ` (HTTP ${w.httpStatus ?? '?'}, PayPal debug id ${w.debugId})` : '')).join(', '))} on this dispute. Only one write per dispute: new proposals are blocked.</div>`;
  const statusWords = { PENDING_SELLER_APPROVAL: 'waiting for your approval', BLOCKED: 'blocked by ProofPilot', BLOCKED_AT_APPROVAL: 'blocked when re-checked against PayPal', APPROVED_DRY_RUN: 'approved (dry run, nothing sent)', EXECUTED_AFTER_APPROVAL: 'sent to PayPal after your approval', DISMISSED: 'dismissed', EXPIRED: 'approval code expired', VOIDED: 'voided after wrong codes', RECORDED: 'recorded', CACHED_NOT_APPROVABLE: 'cached demo, not approvable' };
  h += `<h3>Proposed actions (not executed)</h3><p class="muted">ProofPilot rebuilds every proposal from the dispute's own PayPal records: same case, same payment, at most the disputed amount, same currency, and only if it matches the final recommendation. Notes to PayPal and the buyer are ProofPilot templates, never the model's text.</p>` + (run.proposals.length ? run.proposals.map(p => `<div class="claim ${/BLOCKED/.test(p.status) ? 'bad' : ''}">
      <b>${PP.esc(PP.h('tool', p.tool))}</b>: ${PP.esc(p.description || '')} · <b>${PP.esc(statusWords[p.status] || PP.h('x', p.status))}</b>
      ${p.paypal?.debugId ? `<div>PayPal HTTP ${PP.esc(p.paypal.status ?? '')} · debug id <code>${PP.esc(p.paypal.debugId)}</code></div>` : ''}
      ${(p.blockedReasons || []).length ? `<div>Why: ${PP.esc(p.blockedReasons.map(r => PP.h('binding', r)).join('; '))}</div>` : ''}
      ${p.canonical ? `<details><summary>Exactly what would be sent</summary><pre>${PP.esc(JSON.stringify(p.canonical, null, 2))}</pre><small>Proposal hash ${PP.esc(String(p.hash || '').slice(0, 16))}</small></details>` : ''}
      ${p.status === 'PENDING_SELLER_APPROVAL' && p.executable && p.liveCode ? `<div>To run this on PayPal, type the approval code for proposal <code>${PP.esc(p.id)}</code>. It is printed only in the ProofPilot server console (the terminal running <code>npm start</code>, or your host's private log), never sent to this page or the API. Single use, expires ${new Date(p.tokenExpiresAt).toLocaleTimeString()}.<br><input size="22" id="pc-${p.id}" placeholder="APPROVE-XXXXX-XXXXX" autocomplete="off"> <button class="sec" data-approve="${p.id}">Approve and run</button> <button class="sec" data-dismiss="${p.id}">Dismiss</button></div>` : ''}
      ${p.status === 'PENDING_SELLER_APPROVAL' && p.executable && !p.liveCode ? '<div class="muted">No live approval code (the server restarted or the code was used). Ask the agent again.</div>' : ''}
      ${p.status === 'PENDING_SELLER_APPROVAL' && p.kind === 'evidence' && p.canonical?.evidence_type ? `<div><button class="sec" data-usepack="${PP.esc(p.canonical.evidence_type)}">Open in evidence pack</button> (sent only through Approve and submit below)</div>` : ''}
    </div>`).join('') : '<div class="muted">The agent proposed no write action.</div>');
  agentCard.innerHTML = h;
  agentCard.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => { const pid = b.dataset.approve;
    try { const r = await PP.api(`/api/agent/proposals/${pid}/approve`, { method: 'POST', body: { approved: true, token: document.getElementById('pc-' + pid).value } });
      alert(r.dryRun ? 'Dry run: approved and re-checked against PayPal, nothing sent.' : `Sent to PayPal sandbox.${r.paypal?.debugId ? ` HTTP ${r.paypal.status ?? ''}, PayPal debug id ${r.paypal.debugId}.` : ''}`); } catch (e) { alert(e.message); } loadAgent(); refresh(); });
  agentCard.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = async () => { await PP.api(`/api/agent/proposals/${b.dataset.dismiss}/dismiss`, { method: 'POST', body: {} }); loadAgent(); });
  agentCard.querySelectorAll('[data-usepack]').forEach(b => b.onclick = () => { type = b.dataset.usepack; render(); pack.scrollIntoView(); });
}

async function refresh() {
  try { A = await PP.api(`/api/disputes/${encodeURIComponent(id)}`); render();
    clearTimeout(pollTimer); if (A.status.waiting) pollTimer = setTimeout(refresh, 15000);
  } catch (e) { head.innerHTML = `<div class="banner err">${PP.esc(e.message)}${e.data?.debugId ? ' (debug_id ' + PP.esc(e.data.debugId) + ')' : ''}</div>`; }
}
PP.configBanner(document.getElementById('cfg')).then(() => { refresh(); loadAgent(); });
</script></body></html>
