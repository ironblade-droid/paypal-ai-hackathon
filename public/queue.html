<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProofPilot dispute queue</title><link rel="stylesheet" href="/app.css"><script src="/common.js"></script>
<script src="/vendor/ag-grid/ag-grid-community.min.js"></script></head>
<body><main>
<div id="cfg"></div>
<h1>Dispute queue</h1>
<p class="muted">Live from PayPal Disputes v1. Sorted by what needs you first. Refreshes every 30 seconds.</p>
<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <input id="q" placeholder="Filter…"> <button class="sec" id="refresh">Refresh</button>
  <span class="muted" id="meta"></span>
  <span style="margin-left:auto"><input id="openId" placeholder="Open dispute by ID (PP-R-…)" size="26"> <button class="sec" id="openBtn">Open</button></span>
</div>
<div id="waitBanner"></div>
<div id="grid" class="ag-theme-quartz" style="height:420px"></div>
</main>
<script>
PP.nav('/disputes');
const order = { act: 0, wait: 1, review: 2, closed: 3 };
let grid;
async function load() {
  try {
    const r = await PP.api('/api/disputes');
    grid.setGridOption('rowData', r.items);
    meta.textContent = `${r.items.length} dispute(s) · fetched ${new Date(r.fetchedAt).toLocaleTimeString()}`;
    const w = r.items.filter(i => i.waiting).length;
    waitBanner.innerHTML = w ? `<div class="banner wait">${w} new dispute(s) are waiting for PayPal to offer actions (usually 3 to 5 minutes). Polling.</div>` : '';
  } catch (e) { meta.innerHTML = `<span class="sev-BLOCK">${PP.esc(e.message)}</span>`; }
}
(async () => {
  await PP.configBanner(document.getElementById('cfg'));
  grid = agGrid.createGrid(document.getElementById('grid'), {
    columnDefs: [
      { field: 'label', headerName: 'Status', width: 190, cellRenderer: p => PP.badge(p.value, p.data.tone), comparator: (a, b, na, nb) => order[na.data.tone] - order[nb.data.tone], sort: 'asc' },
      { field: 'id', headerName: 'Dispute', width: 190, cellRenderer: p => `<a href="/disputes/${encodeURIComponent(p.value)}">${PP.esc(p.value)}</a>` },
      { field: 'reason', flex: 1, minWidth: 200 },
      { field: 'amount', width: 110, valueFormatter: p => `${p.data.currency} ${Number(p.value).toFixed(2)}`, filter: 'agNumberColumnFilter' },
      { field: 'stage', width: 120 },
      { field: 'hoursLeft', headerName: 'Respond within', width: 140, valueFormatter: p => p.value == null ? '—' : p.value < 0 ? 'overdue' : `${p.value} h`,
        cellStyle: p => p.value != null && p.value < 48 ? { color: '#b3261e', fontWeight: 700 } : null },
      { field: 'requested', headerName: 'PayPal asks for', width: 200 },
      { field: 'actions', headerName: 'Actions offered', width: 200, valueFormatter: p => p.value || 'none yet' },
      { field: 'protection', headerName: 'Seller Protection', width: 140, valueFormatter: p => p.value == null ? '—' : p.value ? 'eligible' : 'not eligible' },
      { field: 'updated', width: 170, valueFormatter: p => p.value ? new Date(p.value).toLocaleString() : '' },
    ],
    defaultColDef: { sortable: true, filter: true, resizable: true },
    onRowDoubleClicked: e => location.href = '/disputes/' + encodeURIComponent(e.data.id),
  });
  load(); setInterval(load, 30000);
})();
q.oninput = () => grid.setGridOption('quickFilterText', q.value);
refresh.onclick = load;
openBtn.onclick = () => openId.value.trim() && (location.href = '/disputes/' + encodeURIComponent(openId.value.trim()));
</script></body></html>
